[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fwasset"
version = "0.1.0"
description = "Massage Chair Firmware Asset Manager"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "pyside6>=6.6.3.1",
    "pyside6-fluent-widgets>=1.11.2",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "mypy>=1.13.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "types-psutil>=6.0.0",
]
[project.scripts]
fwasset = "fwasset.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fwasset"]

[tool.pytest.ini_options]
testpaths = ["src/fwasset/tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--cov=src/fwasset --cov-report=term-missing --cov-fail-under=80"
markers = [
    "ui: tests that require a display (deselected with -m 'not ui')",
]

[tool.coverage.run]
source = ["src/fwasset"]
omit = ["src/fwasset/app.py", "src/fwasset/ui_qt/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/fwasset/core", "src/fwasset/ui_common", "scripts"]
exclude = ["scripts/spike_pyside6.py"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
]
