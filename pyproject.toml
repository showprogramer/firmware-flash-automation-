[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fwasset"
version = "0.1.0"
description = "Massage Chair Firmware Asset Manager"
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.2",
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "pyserial>=3.5",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fwasset = "fwasset.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fwasset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--cov=src/fwasset --cov-report=term-missing --cov-fail-under=80"
markers = [
    "ui: tests that require customtkinter or a display (deselected with -m 'not ui')",
]

[tool.coverage.run]
source = ["src/fwasset"]
omit = ["src/fwasset/app.py", "src/fwasset/ui/*"]
