[project]
name = "handcontrol-uitool"
version = "0.1.0"
description = "Hand control UI flashing helper for ROM/PKG copy and Excel tracking"
requires-python = ">=3.8"
dependencies = [
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
]
optional-dependencies = { dev = ["pytest>=8.0.0"] }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
