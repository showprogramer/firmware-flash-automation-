[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "handcontrol-uitool"
version = "0.1.0"
description = "Hand control UI flashing helper for ROM/PKG copy and Excel tracking"
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.2",
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
handcontrol = "handcontrol.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handcontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--cov=src/handcontrol --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/handcontrol"]
omit = ["src/handcontrol/app.py", "src/handcontrol/ui/*"]
